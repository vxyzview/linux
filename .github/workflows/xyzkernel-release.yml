name: xyzkernel release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update. Defaults to xyzkernel-${run_number}."
        required: false
        type: string
      make_jobs:
        description: "Parallel make jobs per distro build. Full LTO can need a lot of RAM."
        default: "2"
        required: false
        type: string
  push:
    tags:
      - "xyzkernel-*"

permissions:
  contents: write

env:
  KERNEL_PACKAGE_NAME: xyzkernel
  LLVM_VERSION: 22.1.5
  MAKE_JOBS: ${{ github.event.inputs.make_jobs || '2' }}

jobs:
  build:
    name: Build ${{ matrix.format }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: debian
            image: debian:trixie
          - format: archlinux
            image: archlinux:base-devel
          - format: fedora
            image: fedora:latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet || true
          docker system prune --all --force || true
          df -h

      - name: Build ${{ matrix.format }} packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/${{ matrix.format }} build/ci

          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            --env ARTIFACT_ROOT=/src/artifacts \
            --env GITHUB_RUN_NUMBER="${GITHUB_RUN_NUMBER}" \
            --env GITHUB_SHA="${GITHUB_SHA}" \
            --env HOST_GID="$(id -g)" \
            --env HOST_UID="$(id -u)" \
            --env KERNEL_PACKAGE_NAME="${KERNEL_PACKAGE_NAME}" \
            --env LLVM_VERSION="${LLVM_VERSION}" \
            --env MAKE_JOBS="${MAKE_JOBS}" \
            --env OUT_ROOT=/src/build/ci \
            --env PACKAGE_FORMAT=${{ matrix.format }} \
            ${{ matrix.image }} \
            bash scripts/ci/build-xyzkernel-packages.sh

      - name: Upload ${{ matrix.format }} packages
        uses: actions/upload-artifact@v4
        with:
          name: xyzkernel-${{ matrix.format }}
          path: |
            artifacts/${{ matrix.format }}/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Resolve release tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${REQUESTED_TAG}" ]; then
            tag="${REQUESTED_TAG}"
          else
            tag="xyzkernel-${GITHUB_RUN_NUMBER}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          find release-assets -type f | sort
          mapfile -t assets < <(find release-assets -type f | sort)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

          mapfile -t arch_packages < <(find release-assets -type f -name '*.pkg.tar.*' ! -name '*.sha256' ! -name '*.sig' -printf '%f\n' | sort)
          mapfile -t debian_packages < <(find release-assets -type f -name '*.deb' -printf '%f\n' | sort)
          mapfile -t fedora_packages < <(find release-assets -type f -name '*.rpm' -printf '%f\n' | sort)
          mapfile -t build_info < <(find release-assets -type f -name '*-build-info.txt' -printf '%f\n' | sort)
          kernelrelease="$(find release-assets -type f -name '*-build-info.txt' -print -quit | xargs -r sed -n 's/^kernelrelease=//p' | head -n1)"

          print_list() {
            local item
            for item in "$@"; do
              printf -- "- `%s`\n" "${item}"
            done
          }

          print_install_command() {
            local installer="$1"
            shift

            [ "$#" -gt 0 ] || return 0

            echo '```bash'
            if [ "$#" -eq 1 ]; then
              printf '%s ./%s\n' "${installer}" "$1"
            else
              printf '%s \\\n' "${installer}"
              while [ "$#" -gt 0 ]; do
                if [ "$#" -eq 1 ]; then
                  printf '  ./%s\n' "$1"
                else
                  printf '  ./%s \\\n' "$1"
                fi
                shift
              done
            fi
            echo '```'
          }

          {
            echo "# xyzkernel ${RELEASE_TAG}"
            echo
            echo "Native Linux packages built from \`${GITHUB_SHA}\` with LLVM \`${LLVM_VERSION}\`."
            [ -z "${kernelrelease}" ] || echo "Kernel release: \`${kernelrelease}\`."
            echo
            echo "## Install"
            echo
            echo "Download the package files for your distro, then install the matching set together."
            echo
            if [ "${#arch_packages[@]}" -gt 0 ]; then
              echo "### Arch Linux"
              print_install_command "sudo pacman -U" "${arch_packages[@]}"
              echo
            fi
            if [ "${#debian_packages[@]}" -gt 0 ]; then
              echo "### Debian / Ubuntu"
              print_install_command "sudo apt install" "${debian_packages[@]}"
              echo
            fi
            if [ "${#fedora_packages[@]}" -gt 0 ]; then
              echo "### Fedora"
              print_install_command "sudo dnf install" "${fedora_packages[@]}"
              echo
            fi
            echo "## Build"
            echo
            echo "- Config: \`arch/x86/configs/xyz_defconfig\`"
            echo "- Toolchain: \`LLVM=1 LLVM_IAS=1\`"
            echo "- Optimization: \`CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y\`"
            echo "- LTO: \`CONFIG_LTO_CLANG_FULL=y\`"
            echo
            echo "## Packages"
            echo
            if [ "${#arch_packages[@]}" -gt 0 ]; then
              echo "### Arch Linux"
              print_list "${arch_packages[@]}"
              echo
            fi
            if [ "${#debian_packages[@]}" -gt 0 ]; then
              echo "### Debian / Ubuntu"
              print_list "${debian_packages[@]}"
              echo
            fi
            if [ "${#fedora_packages[@]}" -gt 0 ]; then
              echo "### Fedora"
              print_list "${fedora_packages[@]}"
              echo
            fi
            echo "## Verification"
            echo
            echo "Each package has a \`.sha256\` sidecar, and every distro build also includes a checksum manifest plus build info."
            if [ "${#build_info[@]}" -gt 0 ]; then
              echo
              echo "Build info files:"
              print_list "${build_info[@]}"
            fi
          } > release-notes.md

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "xyzkernel ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --latest
            gh release upload "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "xyzkernel ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --latest
          fi
